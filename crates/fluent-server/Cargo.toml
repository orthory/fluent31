[package]
name = "fluent-server"
version.workspace = true
edition.workspace = true
description = "Server mode for fluent31: GraphQL and the replication join point over one shared database handle in one process"

[lib]
name = "fluent_server"
path = "src/lib.rs"

[[bin]]
name = "fluent-server"
path = "src/main.rs"

[dependencies]
fluent31 = { path = "../fluent31" }
fluent-graphql = { path = "../fluent-graphql" }
fluent-replication = { path = "../fluent-replication" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
